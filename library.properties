name=Universal Device Interface
version=0.1.0
author=Vishwam Aggarwal <vishwam.aggarwal@gmail.com>
maintainer=Vishwam Aggarwal <vishwam.aggarwal@gmail.com>
sentence=Foundation layer for the Universal-*-Interface library family: the shared IDevice base class and global error sink.
paragraph=Provides IDevice (lifecycle, a shared DeviceState enum plus per-device status/error codes, an identity string) and one process-wide GlobalErrorSink registration that every device type reports through. Not motion-specific: any sensor, actuator, or orchestrator interface can derive from it. Plain C++11, zero Arduino dependency.
category=Device Control
url=https://github.com/vishwam-aggarwal/Universal-Device-Interface
architectures=*
includes=IDevice.h,GlobalErrorSink.h
