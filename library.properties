name=Universal Device Interface
version=0.6.0
author=Vishwam Aggarwal <vishwam.aggarwal@gmail.com>
maintainer=Vishwam Aggarwal <vishwam.aggarwal@gmail.com>
sentence=Foundation layer for the Universal-*-Interface library family: the shared IDevice base class and global error sink.
paragraph=A device declares each attribute once (type, name, unit, limits, default, enumeration) as a UdiAttr member; UDI generates its description, flash metadata and callback wiring, and the compiler enforces a Set_ callback for every w attribute. Every device has an rState with the standard state enumeration and reports through one process-wide error sink. Plain C++11, zero Arduino dependency.
category=Device Control
url=https://github.com/vishwam-aggarwal/Universal-Device-Interface
architectures=*
includes=IDevice.h,UdiAttr.h,UdiDeclare.h,Attr.h,IDescriber.h,GlobalErrorSink.h
